apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
  labels:
    app: {{ .Release.Name }}-app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-app
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-app
    spec:
      # Graceful shutdown force-saves every active Room and releases its lock
      terminationGracePeriodSeconds: 60
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            # Pod Identity for Room Locks
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REDIS_URL
              {{- if .Values.redis.enabled }}
              value: "redis://{{ .Release.Name }}-redis:6379"
              {{- else }}
              value: {{ required "redis.url is required when redis.enabled=false" .Values.redis.url | quote }}
              {{- end }}
            - name: GCS_BUCKET_NAME
              value: {{ .Values.env.gcsBucketName | quote }}
            {{- if .Values.emulator.enabled }}
            - name: GCS_API_ENDPOINT
              value: "http://{{ .Release.Name }}-gcs:4443"
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
