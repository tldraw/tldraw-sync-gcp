apiVersion: v2
name: tldraw-sync-aws
description: >
  tldraw sync backend for AWS (EKS + S3). Room ownership and worker membership
  live in the bucket under owners/ and members/; Envoy plus the room-router
  replace ingress-nginx. With emulator.enabled (the default) it is a
  self-contained local stack running LocalStack in-cluster.
type: application
version: 0.1.0
appVersion: "1.0.0"
