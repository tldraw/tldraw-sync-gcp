apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-envoy
data:
  envoy.yaml: |
{{ .Files.Get "files/envoy.yaml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-router
  labels:
    app: {{ .Release.Name }}-router
spec:
  replicas: {{ .Values.router.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-router
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-router
    spec:
      containers:
        # Envoy reaches the router over loopback; nothing outside the pod can
        # reach either the admin port or the ext_authz port.
        - name: envoy
          image: {{ .Values.router.envoyImage | quote }}
          args: ["-c", "/etc/envoy/envoy.yaml"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
        - name: router
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["yarn", "start:router"]
          ports:
            - name: authz
              containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: ROUTER_MODE
              value: ext-authz
            - name: REGISTRY_BACKEND
              value: {{ .Values.registry.backend | quote }}
            {{- if eq .Values.registry.backend "redis" }}
            - name: REDIS_URL
              value: {{ .Values.redis.url | default (printf "redis://%s-redis:6379" .Release.Name) | quote }}
            {{- end }}
            - name: S3_BUCKET_NAME
              value: {{ .Values.env.s3BucketName | quote }}
            - name: AWS_REGION
              value: {{ .Values.env.awsRegion | quote }}
            - name: MEMBER_POLL_INTERVAL_MS
              value: {{ .Values.timings.memberPollIntervalMs | quote }}
            - name: MEMBER_TTL_MS
              value: {{ .Values.timings.memberTtlMs | quote }}
            {{- if .Values.emulator.enabled }}
            - name: S3_ENDPOINT
              value: "http://{{ .Release.Name }}-localstack:4566"
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.emulator.accessKey | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.emulator.secretKey | quote }}
            {{- end }}
      volumes:
        - name: envoy-config
          configMap:
            name: {{ .Release.Name }}-envoy
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-router
  labels:
    app: {{ .Release.Name }}-router
spec:
  type: LoadBalancer
  selector:
    app: {{ .Release.Name }}-router
  ports:
    - name: http
      port: {{ .Values.router.port }}
      targetPort: 8080
---
# The router's internal API, deliberately NOT on the LoadBalancer above: that
# one fronts Envoy, and anything published there is reachable from outside.
# These endpoints are unauthenticated and must stay cluster-internal.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-router-internal
  labels:
    app: {{ .Release.Name }}-router
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-router
  ports:
    - name: internal
      port: 8081
      targetPort: 8081
