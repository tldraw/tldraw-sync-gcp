replicaCount: 2

image:
  repository: tldraw-sync-aws
  tag: local
  pullPolicy: IfNotPresent

# Envoy + room-router as a sidecar pair. This REPLACES ingress-nginx for the
# AWS demo rather than sitting behind it - see ADR 0005. There is no Ingress:
# fronting Envoy with nginx locally would demonstrate exactly the added tier
# the design says does not exist.
router:
  replicaCount: 2
  # Published by the Service. Not :80, which k3s svclb has already bound for
  # the nginx controller still serving the GCP demo and Grafana.
  port: 8081
  envoyImage: envoyproxy/envoy:v1.34-latest

# See the design doc for why 2s/8s and not 2s/6s. MEMBER_TTL is a
# false-positive threshold, not just a detection latency.
timings:
  heartbeatIntervalMs: 2000
  memberPollIntervalMs: 2000
  memberTtlMs: 8000
  # Backstop only: the router pushes losses immediately.
  ownershipRecheckIntervalMs: 30000

env:
  s3BucketName: tldraw-test-bucket
  awsRegion: us-east-1

# Where ownership and membership live. "s3" keeps everything in the bucket and
# needs no other service; "redis" is the same design with a different store —
# cheaper and lower latency, but liveness and the ability to persist a Snapshot
# stop sharing a channel, which is what the persistence health check pays for.
registry:
  backend: s3

redis:
  enabled: false
  image: redis:7-alpine
  url: ""

# In-cluster LocalStack standing in for S3. On EKS set enabled: false; the AWS
# SDK default provider chain (IRSA) supplies credentials and no endpoint is set.
emulator:
  enabled: true
  # Pinned deliberately, not merely for reproducibility: LocalStack merged its
  # community and pro images in 2026.3.0, so :latest and :stable now exit 55
  # unless LOCALSTACK_AUTH_TOKEN is set. 4.14.0 is the newest tag that still
  # runs unauthenticated. Moving this forward means buying a licence.
  image: localstack/localstack:4.14.0
  # LocalStack accepts any credentials; these are its documented convention.
  accessKey: test
  secretKey: test

podMonitor:
  enabled: true

resources:
  requests:
    memory: 256Mi
    cpu: 250m
  limits:
    memory: 512Mi
    cpu: "1"
