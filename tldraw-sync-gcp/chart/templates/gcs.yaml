{{- if .Values.emulator.enabled }}
# GCS stand-in. No persistent volume: Snapshots are disposable locally (spec).
# public-host/external-url use the in-cluster Service name so URLs the
# emulator hands back (e.g. resumable uploads) work for the app pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gcs
  labels:
    app: {{ .Release.Name }}-gcs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-gcs
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-gcs
    spec:
      containers:
        - name: fake-gcs
          image: fsouza/fake-gcs-server:latest
          args:
            - "-scheme"
            - "http"
            - "-port"
            - "4443"
            - "-public-host"
            - "{{ .Release.Name }}-gcs:4443"
            - "-external-url"
            - "http://{{ .Release.Name }}-gcs:4443"
          ports:
            - containerPort: 4443
          readinessProbe:
            httpGet:
              path: /storage/v1/b
              port: 4443
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gcs
spec:
  selector:
    app: {{ .Release.Name }}-gcs
  ports:
    - port: 4443
      targetPort: 4443
{{- end }}
