apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tldraw-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$uri"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: gcp-sync.tldraw.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tldraw-svc
                port:
                  number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: tldraw-svc
  labels:
    app: tldraw-sync
spec:
  type: ClusterIP
  selector:
    app: tldraw-sync
  ports:
    - name: http
      port: 80
      targetPort: 3001
      protocol: TCP
