apiVersion: apps/v1
kind: Deployment
metadata:
  name: tldraw-sync-deployment
  labels:
    app: tldraw-sync
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tldraw-sync
  template:
    metadata:
      labels:
        app: tldraw-sync
    spec:
      serviceAccountName: tldraw-sync-sa
      containers:
      - name: tldraw-sync
        image: europe-west1-docker.pkg.dev/<project-id>/tldraw-sync/tldraw-gcp:v2
        ports:
            - containerPort: 3001
        env:
          - name: PORT
            value: "3001"
          - name: GCS_BUCKET_NAME
            value: "tldraw-sync-room-data"
          - name: REDIS_URL
            value: "redis://<redis-ip>:6379"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tldraw-sync-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tldraw-sync-deployment
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70