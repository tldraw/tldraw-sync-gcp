# Envoy replaces ingress-nginx; it is not an added tier. It performs no service
# discovery at all: ext_authz names an upstream for every route, affinity or
# not, so there is exactly one traffic cluster with no endpoint configuration.
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
    - name: ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                # WebSockets are long-lived; neither Envoy nor the route may
                # time them out.
                stream_idle_timeout: 0s
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: all
                  # Only ext_authz may choose an upstream. Envoy already strips
                  # x-envoy-* from non-internal addresses; doing it explicitly
                  # makes that a property of this config, not of a default.
                  # This belongs on the route config, NOT on the connection
                  # manager, which has no such field.
                  request_headers_to_remove:
                    - x-envoy-original-dst-host
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: tldraw_workers, timeout: 0s }
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      # Never guess an upstream. With no live members the router
                      # 503s and so does Envoy.
                      failure_mode_allow: false
                      transport_api_version: V3
                      http_service:
                        server_uri:
                          uri: http://127.0.0.1:8081
                          cluster: room_router
                          timeout: 2s
                        authorization_response:
                          allowed_upstream_headers:
                            patterns:
                              - exact: x-envoy-original-dst-host
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    # Dictated by the router, never discovered. This is the only cluster that
    # carries traffic, and it has no endpoints.
    - name: tldraw_workers
      type: ORIGINAL_DST
      lb_policy: CLUSTER_PROVIDED
      connect_timeout: 2s
      original_dst_lb_config:
        use_http_header: true
        http_header_name: x-envoy-original-dst-host

    # The router itself, over loopback in the same pod.
    - name: room_router
      type: STATIC
      connect_timeout: 1s
      load_assignment:
        cluster_name: room_router
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 8081 }
