apiVersion: apps/v1
kind: Deployment
metadata:
  name: tldraw-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tldraw-server
  template:
    metadata:
      labels:
        app: tldraw-server
    spec:
      containers:
        - name: tldraw-server
          image: us-central1-docker.pkg.dev/tldraw-sync/tldraw-repo/tldraw-sync-gcp:v1
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: GCS_BUCKET_NAME
              value: "tldraw-sync-room-data"
            - name: REDIS_URL
              value: "redis://10.158.158.147:6379"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/secrets/key.json"
          volumeMounts:
            - name: google-cloud-key
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: google-cloud-key
          secret:
            secretName: gcs-key
