name: Build and Deploy to GKE

on:
  push:
    branches:
      - develop

env:
  REGION: europe-west1
  GAR_LOCATION: europe-west1
  REPOSITORY: tldraw-sync
  IMAGE_NAME: tldraw-gcp
  GKE_CLUSTER: tldraw-sync-cluster
  GKE_ZONE: us-central1-a
  DEPLOYMENT_NAME: tldraw-sync-deployment
  NAMESPACE: default

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SA_EMAIL }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

    - name: Build Docker image
      run: |
        docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
        docker tag ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
          ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

    - name: Push Docker image to Artifact Registry
      run: |
        docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest

    - name: Get GKE credentials
      run: |
        gcloud components install gke-gcloud-auth-plugin
        gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} --region ${{ env.REGION }} --dns-endpoint

    - name: Apply Kubernetes manifests
      run: |
        IMAGE_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
        
        # Replace placeholders in deployment.yaml
        sed -i "s|<project-id>|${{ secrets.GCP_PROJECT_ID }}|g" kubernetes/deployment.yaml
        sed -i "s|<redis-ip>|${{ secrets.REDIS_IP }}|g" kubernetes/deployment.yaml
        sed -i "s|image: .*tldraw-gcp:.*|image: ${IMAGE_TAG}|" kubernetes/deployment.yaml
        
        # Apply all manifests in correct order
        kubectl apply -f kubernetes/service-account.yaml -n ${{ env.NAMESPACE }}
        
        # RBAC requires cluster-admin permissions - skip if already applied or no permissions
        kubectl apply -f kubernetes/rbac.yaml -n ${{ env.NAMESPACE }} 2>/dev/null || echo "⚠️  RBAC skipped (already exists or requires manual apply with cluster-admin)"
        
        kubectl apply -f kubernetes/headless-service.yaml -n ${{ env.NAMESPACE }}
        kubectl apply -f kubernetes/deployment.yaml -n ${{ env.NAMESPACE }}

    - name: Verify deployment rollout
      run: |
        kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }}
