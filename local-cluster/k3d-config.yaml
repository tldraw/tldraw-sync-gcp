apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: tldraw-local
servers: 1
agents: 3
ports:
  # host 8080 -> k3d loadbalancer :80 -> svclb -> ingress-nginx controller
  - port: 8080:80
    nodeFilters:
      - loadbalancer
  # host 8081 -> Envoy Service for the AWS demo. It needs a port of its own
  # rather than :80, which k3s svclb has already bound for ingress-nginx.
  # A cluster created before this entry does not pick it up on re-apply:
  #   k3d node edit k3d-tldraw-local-serverlb --port-add 8081:8081
  # adds it without recreating the cluster.
  # nginx still serves gcp.localhost and grafana.localhost on 8080.
  - port: 8081:8081
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs:
      # ingress-nginx replaces the bundled Traefik (parity with GKE/EKS, ADR 0002)
      - arg: "--disable=traefik"
        nodeFilters:
          - server:*
