apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
  labels:
    app: {{ .Release.Name }}-app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-app
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-app
    spec:
      # Drain deregisters, waits ~2x the router poll so every router drops us,
      # then persists and vacates every Room it holds.
      terminationGracePeriodSeconds: 90
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            # Owner Identity: the exact string written into both members/ and
            # owners/. Envoy dials this directly, with no Service in the path.
            # POD_IP must be declared first: Kubernetes resolves $(VAR) only
            # against variables defined earlier in the list.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: ADVERTISE_ADDR
              value: "http://$(POD_IP):3001"
            - name: HEARTBEAT_INTERVAL_MS
              value: {{ .Values.timings.heartbeatIntervalMs | quote }}
            - name: MEMBER_POLL_INTERVAL_MS
              value: {{ .Values.timings.memberPollIntervalMs | quote }}
            - name: MEMBER_TTL_MS
              value: {{ .Values.timings.memberTtlMs | quote }}
            - name: OWNERSHIP_RECHECK_INTERVAL_MS
              value: {{ .Values.timings.ownershipRecheckIntervalMs | quote }}
            # The internal Service, not the LoadBalancer: that one fronts
            # Envoy, which would proxy this straight back to a worker.
            - name: ROUTER_INTERNAL_URL
              value: "http://{{ .Release.Name }}-router-internal:8081"
            - name: REGISTRY_BACKEND
              value: {{ .Values.registry.backend | quote }}
            {{- if eq .Values.registry.backend "redis" }}
            - name: REDIS_URL
              value: {{ .Values.redis.url | default (printf "redis://%s-redis:6379" .Release.Name) | quote }}
            {{- end }}
            - name: S3_BUCKET_NAME
              value: {{ .Values.env.s3BucketName | quote }}
            - name: AWS_REGION
              value: {{ .Values.env.awsRegion | quote }}
            {{- if .Values.emulator.enabled }}
            - name: S3_ENDPOINT
              value: "http://{{ .Release.Name }}-localstack:4566"
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            - name: AWS_ACCESS_KEY_ID
              value: {{ .Values.emulator.accessKey | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ .Values.emulator.secretKey | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
