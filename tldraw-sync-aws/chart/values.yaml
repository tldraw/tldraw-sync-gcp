replicaCount: 2

image:
  repository: tldraw-sync-aws
  tag: local
  pullPolicy: IfNotPresent

ingress:
  enabled: true
  host: aws.localhost

env:
  s3BucketName: tldraw-test-bucket
  awsRegion: us-east-1

# In-cluster Redis for local use. On EKS set enabled: false and url to the
# ElastiCache endpoint (rediss:// if TLS).
redis:
  enabled: true
  url: ""

# In-cluster LocalStack standing in for S3. On EKS set enabled: false; the AWS
# SDK default provider chain (IRSA) supplies credentials and no endpoint is set.
emulator:
  enabled: true
  # Pinned deliberately, not merely for reproducibility: LocalStack merged its
  # community and pro images in 2026.3.0, so :latest and :stable now exit 55
  # unless LOCALSTACK_AUTH_TOKEN is set. 4.14.0 is the newest tag that still
  # runs unauthenticated. Moving this forward means buying a licence.
  image: localstack/localstack:4.14.0
  # LocalStack accepts any credentials; these are its documented convention.
  accessKey: test
  secretKey: test

podMonitor:
  enabled: true

resources:
  requests:
    memory: 256Mi
    cpu: 250m
  limits:
    memory: 512Mi
    cpu: "1"
