---
apiVersion: v1
kind: Service
metadata:
  name: tldraw-sync-loadbalancer
spec:
  type: LoadBalancer
  selector:
    app: tldraw-sync
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  externalTrafficPolicy: Local
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3001